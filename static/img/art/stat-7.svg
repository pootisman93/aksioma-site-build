<path d="M372 104 V120 M364 112 H380"/>
<path d="M226 196 V206 M221 201 H231" opacity=".7"/>
</g>
<!-- галочка -->
<circle cx="88" cy="188" r="20" fill="#E7F6EE"/>
<path d="M78 188 L86 196 L100 180" stroke="#067647" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
