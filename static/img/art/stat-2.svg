<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Наружный блок и разные внутренние блоки: для квартиры, офиса и магазина">
<defs>
<linearGradient id="ob" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E1E9F5"/></linearGradient>
<linearGradient id="ub" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EDF2F9"/></linearGradient>
<radialGradient id="fan" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#C9D8EE"/><stop offset="1" stop-color="#8FA7C9"/></radialGradient>
</defs>
<!-- трасса -->
<ellipse cx="200" cy="122" rx="150" ry="92" fill="none" stroke="#A9BEDC" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
<!-- наружный блок в центре -->
<g transform="translate(160 78)">
<rect width="80" height="92" rx="8" fill="url(#ob)" stroke="#8FA7C9" stroke-width="1.5"/>
<circle cx="34" cy="46" r="27" fill="#F4F7FB" stroke="#8FA7C9" stroke-width="1.5"/>
<circle cx="34" cy="46" r="21" fill="url(#fan)" opacity=".55"/>
<path d="M34 46 C40 30 52 34 50 40 C48 46 40 46 34 46 C28 62 16 58 18 52 C20 46 28 46 34 46 Z" fill="#1B2F55" opacity=".75"/>
<circle cx="34" cy="46" r="4" fill="#1B2F55"/>
<path d="M66 18 V78 M71 18 V78" stroke="#C9D8EE" stroke-width="2"/>
<rect x="8" y="92" width="10" height="5" rx="2" fill="#8FA7C9"/><rect x="62" y="92" width="10" height="5" rx="2" fill="#8FA7C9"/>
</g>
<!-- настенный: квартира -->
<g transform="translate(34 22)">
<rect width="112" height="34" rx="10" fill="url(#ub)" stroke="#8FA7C9" stroke-width="1.5"/>
<rect x="10" y="24" width="92" height="4" rx="2" fill="#1B2F55"/>
<circle cx="96" cy="11" r="2.5" fill="#4FC3F7"/>
<path d="M30 44 C34 52 30 58 36 64 M56 44 C60 52 56 58 62 64 M82 44 C86 52 82 58 88 64" stroke="#4FC3F7" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/>
</g>
<rect x="34" y="94" width="72" height="22" rx="11" fill="#1B2F55"/>
<text x="70" y="109" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">квартира</text>
<!-- кассетный: офис -->
<g transform="translate(286 24)">
<rect width="80" height="80" rx="10" fill="url(#ub)" stroke="#8FA7C9" stroke-width="1.5"/>
<rect x="20" y="20" width="40" height="40" rx="4" fill="#E1E9F5" stroke="#A9BEDC"/>
<path d="M24 28 H56 M24 36 H56 M24 44 H56 M24 52 H56" stroke="#A9BEDC" stroke-width="2"/>
<rect x="8" y="16" width="5" height="48" rx="2.5" fill="#1B2F55"/><rect x="67" y="16" width="5" height="48" rx="2.5" fill="#1B2F55"/>
<rect x="16" y="7" width="48" height="5" rx="2.5" fill="#1B2F55"/><rect x="16" y="68" width="48" height="5" rx="2.5" fill="#1B2F55"/>
</g>
<rect x="296" y="112" width="60" height="22" rx="11" fill="#1B2F55"/>
<text x="326" y="127" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">офис</text>
<!-- канальный / напольно-потолочный: магазин -->
<g transform="translate(118 190)">
<rect width="164" height="36" rx="10" fill="url(#ub)" stroke="#8FA7C9" stroke-width="1.5"/>
<rect x="14" y="10" width="136" height="16" rx="4" fill="#E1E9F5" stroke="#A9BEDC"/>
<path d="M22 14 V22 M32 14 V22 M42 14 V22 M52 14 V22 M62 14 V22 M72 14 V22 M82 14 V22 M92 14 V22 M102 14 V22 M112 14 V22 M122 14 V22 M132 14 V22 M142 14 V22" stroke="#8FA7C9" stroke-width="2"/>
</g>
<rect x="296" y="196" width="72" height="22" rx="11" fill="#E8833A"/>
<text x="332" y="211" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">магазин</text>
</svg>
