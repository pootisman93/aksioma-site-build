<g transform="translate(160 52)"><rect x="0" y="0" width="10" height="28" rx="5" fill="#fff" stroke="#8FA7C9" stroke-width="1.3"/><circle cx="5" cy="30" r="6" fill="#E8833A"/><rect x="3" y="12" width="4" height="16" rx="2" fill="#E8833A"/></g>
<g transform="translate(342 52)"><rect x="0" y="0" width="10" height="28" rx="5" fill="#fff" stroke="#8FA7C9" stroke-width="1.3"/><circle cx="5" cy="30" r="6" fill="#4FC3F7"/><rect x="3" y="16" width="4" height="12" rx="2" fill="#4FC3F7"/></g>
</svg>
