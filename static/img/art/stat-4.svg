<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Работа on/off и инверторного кондиционера: графики температуры">
<defs>
<linearGradient id="cd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6EEF8"/></linearGradient>
<linearGradient id="fb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4FC3F7" stop-opacity=".35"/><stop offset="1" stop-color="#4FC3F7" stop-opacity="0"/></linearGradient>
<linearGradient id="fo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8833A" stop-opacity=".28"/><stop offset="1" stop-color="#E8833A" stop-opacity="0"/></linearGradient>
</defs>
<!-- левая карточка: on/off -->
<rect x="26" y="34" width="166" height="172" rx="18" fill="url(#cd)" stroke="#A9BEDC" stroke-width="1.5"/>
<rect x="44" y="50" width="62" height="22" rx="11" fill="#FDEFE3"/>
<text x="75" y="65.5" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="12" font-weight="700" fill="#A9531A">on/off</text>
<path d="M44 176 H176" stroke="#C9D8EE" stroke-width="1.5"/>
<path d="M44 128 H176" stroke="#C9D8EE" stroke-width="1.5" stroke-dasharray="4 5"/>
<path d="M44 150 L60 108 L76 150 L92 108 L108 150 L124 108 L140 150 L156 108 L172 150 V176 H44 Z" fill="url(#fo)"/>
<path d="M44 150 L60 108 L76 150 L92 108 L108 150 L124 108 L140 150 L156 108 L172 150" stroke="#E8833A" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
<!-- правая карточка: инвертор -->
<rect x="208" y="34" width="166" height="172" rx="18" fill="url(#cd)" stroke="#A9BEDC" stroke-width="1.5"/>
<rect x="226" y="50" width="78" height="22" rx="11" fill="#EAF0F8"/>
<text x="265" y="65.5" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="12" font-weight="700" fill="#1B2F55">инвертор</text>
<path d="M226 176 H358" stroke="#C9D8EE" stroke-width="1.5"/>
<path d="M226 128 H358" stroke="#C9D8EE" stroke-width="1.5" stroke-dasharray="4 5"/>
<path d="M226 96 C246 96 252 126 272 128 C292 130 300 124 318 128 C334 131 344 126 356 128 V176 H226 Z" fill="url(#fb)"/>
<path d="M226 96 C246 96 252 126 272 128 C292 130 300 124 318 128 C334 131 344 126 356 128" stroke="#2F6BFF" stroke-width="3" fill="none" stroke-linecap="round"/>
