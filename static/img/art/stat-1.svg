<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Комната с кондиционером: площадь и высота">
<defs>
<linearGradient id="wl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E3EBF6"/></linearGradient>
<linearGradient id="wr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2F6FC"/><stop offset="1" stop-color="#D6E2F2"/></linearGradient>
<linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9D8EE"/><stop offset="1" stop-color="#B4C8E6"/></linearGradient>
<linearGradient id="air" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4FC3F7"/><stop offset="1" stop-color="#2F6BFF" stop-opacity="0"/></linearGradient>
</defs>
<!-- стены и пол -->
<polygon points="200,18 200,140 70,205 70,83" fill="url(#wl)"/>
<polygon points="200,18 200,140 330,205 330,83" fill="url(#wr)"/>
<polygon points="200,140 70,205 200,270 330,205" fill="url(#fl)"/>
<path d="M200 18 V140 M70 205 L200 140 L330 205" stroke="#A9BEDC" stroke-width="1.5" fill="none"/>
<!-- окно на правой стене -->
<polygon points="248,66 302,93 302,140 248,113" fill="#DDF2FD" stroke="#A9BEDC" stroke-width="1.5"/>
<path d="M275 79.5 V126.5" stroke="#A9BEDC" stroke-width="1.5"/>
<!-- кондиционер на левой стене -->
<polygon points="168,57 103,89 112,93.5 177,61.5" fill="#FFFFFF" stroke="#8FA7C9" stroke-width="1.2"/>
<polygon points="177,61.5 112,93.5 112,119 177,87" fill="#F7FAFE" stroke="#8FA7C9" stroke-width="1.2"/>
<polygon points="168,57 177,61.5 177,87 168,82.5" fill="#DCE6F3"/>
<path d="M118 111 L171 85" stroke="#1B2F55" stroke-width="3" stroke-linecap="round"/>
<circle cx="164" cy="74" r="2" fill="#4FC3F7"/>
<!-- поток воздуха -->
<path d="M140 112 C150 135 175 150 205 160" stroke="url(#air)" stroke-width="5" fill="none" stroke-linecap="round"/>
<path d="M125 118 C130 145 150 168 180 182" stroke="url(#air)" stroke-width="5" fill="none" stroke-linecap="round" opacity=".8"/>
<path d="M155 106 C172 124 200 132 232 136" stroke="url(#air)" stroke-width="4" fill="none" stroke-linecap="round" opacity=".7"/>
<!-- высота h -->
<path d="M214 24 V134" stroke="#E8833A" stroke-width="2" stroke-dasharray="4 4"/>
<path d="M209 24 H219 M209 134 H219" stroke="#E8833A" stroke-width="2" stroke-linecap="round"/>
<rect x="222" y="66" width="24" height="24" rx="12" fill="#E8833A"/>
<text x="234" y="83" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">h</text>
<!-- площадь S -->
<polygon points="200,160 120,200 200,240 280,200" fill="#2F6BFF" opacity=".12" stroke="#2F6BFF" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="184" y="188" width="32" height="24" rx="12" fill="#1B2F55"/>
<text x="200" y="205" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">S</text>
</svg>
