<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Электрический конвектор под окном">
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7FAFE"/><stop offset="1" stop-color="#E3EBF6"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DDF2FD"/><stop offset="1" stop-color="#C6E6FA"/></linearGradient>
<linearGradient id="cv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF3FA"/></linearGradient>
<linearGradient id="heat" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#E8833A"/><stop offset="1" stop-color="#E8833A" stop-opacity="0"/></linearGradient>
</defs>
<rect x="0" y="0" width="400" height="240" fill="url(#wall)"/>
<rect x="0" y="206" width="400" height="34" fill="#C9D8EE"/>
<!-- окно -->
<rect x="112" y="18" width="176" height="104" rx="6" fill="url(#glass)" stroke="#A9BEDC" stroke-width="2"/>
<path d="M200 18 V122 M112 70 H288" stroke="#A9BEDC" stroke-width="2"/>
<g stroke="#4FC3F7" stroke-width="1.6" stroke-linecap="round" opacity=".8"><path d="M150 40 h8 M154 36 v8"/><path d="M246 90 h6 M249 87 v6"/></g>
<rect x="100" y="122" width="200" height="10" rx="3" fill="#FFFFFF" stroke="#A9BEDC" stroke-width="1.5"/>
<!-- тёплый воздух -->
<g fill="none" stroke="url(#heat)" stroke-width="4" stroke-linecap="round">
<path d="M140 150 C132 140 148 132 140 120"/>
<path d="M180 150 C172 140 188 132 180 120"/>
<path d="M220 150 C212 140 228 132 220 120"/>
<path d="M260 150 C252 140 268 132 260 120"/>
</g>
<!-- конвектор -->
<rect x="104" y="150" width="192" height="46" rx="10" fill="url(#cv)" stroke="#8FA7C9" stroke-width="1.5"/>
<g stroke="#C9D8EE" stroke-width="2" stroke-linecap="round"><path d="M118 158 H248"/><path d="M118 164 H248"/></g>
<rect x="262" y="160" width="22" height="26" rx="5" fill="#EAF0F8"/>
<circle cx="273" cy="173" r="6" fill="#FFFFFF" stroke="#1B2F55" stroke-width="2"/>
<path d="M273 173 L276 169" stroke="#E8833A" stroke-width="2" stroke-linecap="round"/>
<path d="M120 196 V206 M280 196 V206" stroke="#8FA7C9" stroke-width="3" stroke-linecap="round"/>
<!-- термометр комнаты -->
<g transform="translate(336 120)"><rect x="0" y="0" width="12" height="44" rx="6" fill="#fff" stroke="#8FA7C9" stroke-width="1.3"/><circle cx="6" cy="48" r="8" fill="#E8833A"/><rect x="3.5" y="16" width="5" height="30" rx="2.5" fill="#E8833A"/></g>
</svg>
