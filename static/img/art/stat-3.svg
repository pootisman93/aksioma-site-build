<circle cx="325" cy="162" r="4" fill="#A9BEDC"/><circle cx="336" cy="162" r="4" fill="#A9BEDC"/><circle cx="347" cy="162" r="4" fill="#A9BEDC"/>
<circle cx="325" cy="176" r="4" fill="#A9BEDC"/><circle cx="336" cy="176" r="4" fill="#A9BEDC"/><circle cx="347" cy="176" r="4" fill="#A9BEDC"/>
